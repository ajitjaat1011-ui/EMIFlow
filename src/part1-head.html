<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMIFlow — Plan Today, Peace Tomorrow</title>
<meta name="description" content="EMIFlow — track every EMI across every lender. Cloud-synced, offline-first, private.">
<meta name="theme-color" content="#f7f8fa">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
/* ==================================================================
   EMIFlow v2.2 “Calm” — flat, quiet, one accent, room to breathe
   ================================================================== */
:root{
  --bg:#f7f8fa;
  --card:#ffffff; --card2:#f1f2f6; --field:#f1f2f6;
  --ink:#191c28; --ink2:#40465a; --mut:#8a8fa3;
  --bd:#e7e9f0;
  --acc:#4f5ce5; --acc-soft:#eef0fd;
  --ok:#178a5e; --okbg:#e9f6f0;
  --warn:#9a6205; --warnbg:#fdf3e2;
  --danger:#cf3a31; --dangerbg:#fdeeed;
  --hero:#1b1f33;
  --sh:0 1px 2px rgba(25,28,40,.04);
  --r:18px; --rs:12px;
  --ease:cubic-bezier(.25,.8,.3,1);
}
[data-theme="dark"]{
  --bg:#0d0f17;
  --card:#151827; --card2:#1b1f31; --field:#1b1f31;
  --ink:#eceef6; --ink2:#c4c8d9; --mut:#7d8299;
  --bd:#232739;
  --acc:#7c88ff; --acc-soft:#1d2140;
  --ok:#3fc78f; --okbg:#12271f;
  --warn:#e5a83b; --warnbg:#2a2115;
  --danger:#f0685f; --dangerbg:#2b1a1c;
  --hero:#1c2033;
  --sh:none;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{min-height:100dvh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5}
body.noanim *{transition:none!important;animation:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1.5px solid transparent;border-radius:var(--rs);padding:12px 14px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:15px 2px 6px}
h1{font-size:21px;font-weight:700;letter-spacing:-.02em}
h2{font-size:17px;font-weight:700;letter-spacing:-.015em}
h3{font-size:15px;font-weight:650;letter-spacing:-.01em}
a{color:var(--acc)}
.hidden{display:none!important}
.mut{color:var(--mut)} .small{font-size:13px} .tiny{font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px} .grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--field);color:var(--mut);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.danger{background:var(--dangerbg);color:var(--danger)} .chip.acc{background:var(--acc-soft);color:var(--acc)}

/* ---------- icons ---------- */
.ic{width:21px;height:21px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:18px;height:18px} .ic.xs{width:15px;height:15px} .ic.lg{width:24px;height:24px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;border-radius:14px;padding:13px 20px;transition:transform .1s,opacity .15s;user-select:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:#fff}
.btn.ghost{background:var(--field);color:var(--ink)}
.btn.line{border:1.5px solid var(--bd);color:var(--ink);background:var(--card)}
.btn.danger{background:var(--dangerbg);color:var(--danger)}
.btn.wide{width:100%} .btn.sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}

/* ================= ONBOARD ================= */
#scr-onboard{min-height:100dvh;display:flex;flex-direction:column;padding:max(28px,env(safe-area-inset-top)) 26px 34px;max-width:520px;margin:0 auto}
.ob-top{display:flex;justify-content:flex-end}
.ob-hero{text-align:center;margin:7vh 0 38px}
.ob-logo{width:76px;height:76px;border-radius:22px;margin-bottom:20px}
.ob-brand{font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.ob-brand em{font-style:normal;color:var(--acc)}
.ob-tag{color:var(--mut);font-size:15.5px;margin-top:8px}
.feats{display:flex;flex-direction:column;gap:6px}
.feat{display:flex;gap:14px;align-items:center;padding:13px 6px;border-bottom:1px solid var(--bd)}
.feat:last-child{border:0}
.feat .fic{width:38px;height:38px;flex:none;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center}
.feat b{display:block;font-size:14.5px;font-weight:650}
.feat p{color:var(--mut);font-size:13px;margin-top:1px}
.ob-cta{margin-top:auto;padding-top:30px;display:flex;flex-direction:column;gap:10px}
.ob-terms{font-size:11.5px;color:var(--mut);text-align:center;margin-top:12px;line-height:1.6}
.ob-demo{font-size:14px;font-weight:600;color:var(--acc);text-align:center;padding:10px}

/* ================= APP FRAME ================= */
#app{max-width:520px;margin:0 auto;min-height:100dvh;padding:0 20px 120px}
.top{display:flex;align-items:center;gap:12px;padding:max(18px,env(safe-area-inset-top)) 0 14px}
.brandmark{width:34px;height:34px;border-radius:10px}
.top h1{font-size:18px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-top:2px}
.syncdot{width:7px;height:7px;border-radius:50%;background:#e0a23e;flex:none}
.syncdot.on{background:var(--ok)} .syncdot.off{background:var(--mut)}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--field);display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:transform .1s}
.iconbtn:active{transform:scale(.92)}

main{position:relative}
.screen{display:none} .screen.on{display:block;animation:screenin .22s var(--ease)}
@keyframes screenin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.sect h2{font-size:16px}
.sect .lnk{font-size:13.5px;font-weight:600;color:var(--acc)}

/* ================= HERO ================= */
.hero{background:var(--hero);color:#fff;border-radius:22px;padding:22px;margin-top:4px}
.hero .hlabel{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.55);font-weight:500}
.hero .hamt{font-size:32px;font-weight:750;letter-spacing:-.03em;margin:8px 0 3px;font-variant-numeric:tabular-nums}
.hero .hsub{font-size:13px;color:rgba(255,255,255,.55)}
.hero .hsub b{color:#ffb98a;font-weight:600}
.hero .hrow{display:flex;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.09)}
.hero .hcell{flex:1}
.hero .hcell .k{font-size:12px;color:rgba(255,255,255,.5)}
.hero .hcell .v{font-size:16px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.hero .hnext{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px}
.hero .hnext .t{font-size:12px;color:rgba(255,255,255,.5)}
.hero .hnext .v{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:1px}

/* ================= CARDS / LISTS ================= */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:12px}
.card>h3{margin-bottom:14px;font-weight:650}
.loans{display:flex;flex-direction:column;gap:10px}
.loan{display:flex;gap:13px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;cursor:pointer;transition:transform .1s}
.loan:active{transform:scale(.985)}
.loan .lic{width:44px;height:44px;flex:none;border-radius:12px;object-fit:contain;background:#fff;border:1px solid var(--bd);padding:5px}
.loan .lic.ph{display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px}
.loan .t{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.loan .s{font-size:12.5px;color:var(--mut);margin-top:1px}
.loan .right{text-align:right;flex:none}
.loan .amt{font-weight:650;font-size:14.5px;font-variant-numeric:tabular-nums}
.loan .st{font-size:12px;margin-top:3px;font-weight:500}
.loan .st.due{color:var(--mut)} .loan .st.soon{color:var(--warn)} .loan .st.over{color:var(--danger);font-weight:600} .loan .st.done{color:var(--ok)}
.pbar{height:4px;background:var(--field);border-radius:99px;margin-top:9px;overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .5s var(--ease)}
.empty{text-align:center;padding:44px 20px;color:var(--mut)}
.empty .eic{width:52px;height:52px;border-radius:16px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.empty h3{color:var(--ink)} .empty p{font-size:13px;margin-top:4px}

/* ================= STATS ================= */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:15px 16px}
.stat .k{font-size:12.5px;color:var(--mut)}
.stat .v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars .b i{width:100%;max-width:32px;border-radius:7px;background:var(--acc);opacity:.9;min-height:4px;transition:height .5s var(--ease)}
.bars .b.past i{opacity:.25}
.bars .b .val{font-size:10.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.bars .b .l{font-size:11px;color:var(--mut)}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.lrow:last-child{border:0;padding-bottom:2px}
.lrow .lic2{width:32px;height:32px;border-radius:9px;object-fit:contain;background:#fff;border:1px solid var(--bd);padding:3px;flex:none}
.lrow .lic2.ph{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;color:#fff}
.lrow .rt{font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;flex:none}
.lrow .nm{font-size:13.5px;font-weight:550}
.lrow .ct{font-size:11.5px;color:var(--mut)}
.lbar{height:4px;background:var(--field);border-radius:99px;overflow:hidden;margin-top:6px}
.lbar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .5s var(--ease)}
.emptyst{color:var(--mut);padding:6px 0;font-size:13px}

/* ================= CALENDAR ================= */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-size:15.5px;font-weight:650}
.calnav{width:34px;height:34px;border-radius:10px;background:var(--field);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calgrid .dow{font-size:11px;color:var(--mut);padding:6px 0;font-weight:500}
.calgrid .day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13.5px;font-weight:500;position:relative}
.calgrid .day.today{box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--acc);font-weight:600}
.calgrid .day.sel{background:var(--acc);color:#fff}
.calgrid .day .dots{display:flex;gap:2px;margin-top:2px;height:4px}
.calgrid .day .dots i{width:4px;height:4px;border-radius:50%}
.d-red{background:#e05a51} .d-amb{background:#e5a83b} .d-teal{background:#4aa893}
.caldays{margin-top:6px}

/* ================= NAV ================= */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:520px;margin:0 auto;display:flex;align-items:center;padding:6px 10px}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);padding:7px 0;font-weight:500}
.navbtn.on{color:var(--acc);font-weight:600}
.navadd{flex:0 0 auto;width:46px;height:46px;border-radius:15px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 4px;transition:transform .12s}
.navadd:active{transform:scale(.9)}

/* ================= SHEETS ================= */
.ov{position:fixed;inset:0;background:rgba(15,17,28,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex;animation:ovin .18s ease}
@keyframes ovin{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:8px 22px calc(26px + env(safe-area-inset-bottom));animation:sheetup .28s var(--ease);overscroll-behavior:contain}
@keyframes sheetup{from{transform:translateY(50px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--bd);margin:8px auto 16px}
.sheet h2{margin-bottom:2px}
.sheet .sub{color:var(--mut);font-size:13px;margin-bottom:4px}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:4px}
.lpick{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 3px 8px;border-radius:13px;border:1.5px solid var(--bd);background:var(--card);cursor:pointer;transition:border-color .12s}
.lpick img{width:30px;height:30px;object-fit:contain}
.lpick span{font-size:10px;font-weight:550;color:var(--mut);text-align:center;line-height:1.2}
.lpick.on{border-color:var(--acc)}
.lpick.on span{color:var(--acc)}
.cgrid{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.cpick{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:550;padding:8px 13px;border-radius:99px;background:var(--field);color:var(--ink2);border:1.5px solid transparent}
.cpick.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;z-index:2;cursor:pointer}
.switch i{position:absolute;inset:0;background:var(--bd);border-radius:99px;transition:.2s}
.switch i:before{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--acc)}
.switch input:checked+i:before{transform:translateX(18px)}

/* ================= ROWS / DETAIL ================= */
.hrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);font-size:14px}
.hrow:last-child{border:0}
.hrow .dd{width:42px;height:42px;flex:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;line-height:1.1}
.hrow .dd.ok{background:var(--okbg);color:var(--ok)} .hrow .dd.mut2{background:var(--field);color:var(--ink2)}
.hrow .dd small{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.dsumgrid{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--field);border-radius:14px;padding:13px 0;margin:12px 0}
.dsumgrid>div{padding:0 14px}
.dsumgrid .k{font-size:11.5px;color:var(--mut)}
.dsumgrid .v{font-size:15.5px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}

/* ================= PROFILE ================= */
.pcard{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-top:4px}
.pavatar{width:54px;height:54px;border-radius:18px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex:none}
.pgroup{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--bd)}
.prow:last-child{border:0}
.prow .pic{width:32px;height:32px;flex:none;border-radius:10px;background:var(--field);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.prow .t{font-weight:550;font-size:14.5px}
.prow .s{font-size:12.5px;color:var(--mut);margin-top:1px}
.seg{display:flex;background:var(--field);border-radius:11px;padding:3px;gap:2px}
.seg button{font-size:12.5px;font-weight:550;padding:7px 12px;border-radius:8px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* ================= BANNER / TOASTS ================= */
.banner{display:flex;gap:11px;align-items:center;background:var(--warnbg);color:var(--warn);border-radius:var(--r);padding:13px 16px;margin-bottom:12px;font-size:13.5px;font-weight:550}
.banner .bpay{font-weight:650;color:var(--warn);flex:none}
#toasts{position:fixed;top:calc(14px + env(safe-area-inset-top));left:0;right:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--hero);color:#fff;font-size:13.5px;font-weight:550;padding:11px 18px;border-radius:99px;max-width:86%;animation:toastin .3s var(--ease)}
[data-theme="dark"] .toast{background:#262b42}
@keyframes toastin{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.toast.err{background:var(--danger)}

@media (max-width:400px){ .hero .hamt{font-size:28px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5h9.8a3.7 3.7 0 0 0 .6-7.35 5.6 5.6 0 0 0-11-1.2A4.15 4.15 0 0 0 7.5 18.5Z"/><path d="m9.6 13.4 2 2 3.4-3.6"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.8 5.8v6c0 4.6 3 7.7 7.2 9.2 4.2-1.5 7.2-4.6 7.2-9.2v-6Z"/><path d="m9 11.8 2.2 2.2 4-4.2"/></symbol>

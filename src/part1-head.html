<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMIFlow — Plan Today, Peace Tomorrow</title>
<meta name="description" content="EMIFlow — track every EMI across every lender. Cloud-synced, offline-first, private.">
<meta name="theme-color" content="#070b14">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
/* ==================================================================
   EMIFlow v2.1 “AURORA” design system
   glass · mesh gradients · spring motion · custom stroke icons
   ================================================================== */
:root{
  --bg:#eef1f8;
  --ink:#101425; --ink2:#3a4160; --mut:#69708f;
  --card:rgba(255,255,255,.66); --card-solid:#ffffff; --field:rgba(16,20,37,.055);
  --bd:rgba(16,20,37,.08); --bd2:rgba(255,255,255,.65);
  --t1:#0ea5a0; --t2:#4f5ce5; --t3:#8b5cf6;
  --grad:linear-gradient(118deg,#0ea5a0 0%,#4f5ce5 55%,#8b5cf6 115%);
  --acc:#4f5ce5; --acc-soft:rgba(79,92,229,.1);
  --ok:#0d9f6e; --okbg:rgba(13,159,110,.12);
  --warn:#b45309; --warnbg:rgba(224,131,10,.13);
  --danger:#e0342c; --dangerbg:rgba(224,52,44,.1);
  --nav:rgba(255,255,255,.72);
  --sh-sm:0 1px 2px rgba(16,20,37,.05),0 4px 14px rgba(16,20,37,.06);
  --sh-md:0 2px 6px rgba(16,20,37,.06),0 14px 40px rgba(16,20,37,.12);
  --sh-glow:0 10px 30px rgba(79,92,229,.35),0 2px 8px rgba(14,165,160,.25);
  --r:22px; --rs:14px;
  --spring:cubic-bezier(.34,1.45,.5,1);
  --ease:cubic-bezier(.25,.8,.3,1);
}
[data-theme="dark"]{
  --bg:#070b14;
  --ink:#f2f4fb; --ink2:#c8cde0; --mut:#8b91ab;
  --card:rgba(255,255,255,.055); --card-solid:#10141f; --field:rgba(255,255,255,.07);
  --bd:rgba(255,255,255,.09); --bd2:rgba(255,255,255,.09);
  --acc:#7c88ff; --acc-soft:rgba(124,136,255,.13);
  --ok:#34d399; --okbg:rgba(52,211,153,.13);
  --warn:#fbbf24; --warnbg:rgba(251,191,36,.12);
  --danger:#ff6b64; --dangerbg:rgba(255,107,100,.12);
  --nav:rgba(13,17,29,.72);
  --sh-sm:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  --sh-md:0 4px 10px rgba(0,0,0,.45),0 20px 50px rgba(0,0,0,.5);
  --sh-glow:0 12px 34px rgba(79,92,229,.45),0 2px 10px rgba(14,165,160,.3);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{min-height:100dvh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15.5px;line-height:1.45;overflow-x:hidden}
/* ---- aurora mesh backdrop ---- */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
.aurora i:nth-child(1){width:56vmax;height:56vmax;left:-18vmax;top:-22vmax;background:radial-gradient(circle at 35% 35%,rgba(14,165,160,.55),transparent 65%);animation:drift1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:52vmax;height:52vmax;right:-20vmax;top:-8vmax;background:radial-gradient(circle at 60% 40%,rgba(99,102,241,.5),transparent 65%);animation:drift2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:44vmax;height:44vmax;left:12vmax;bottom:-26vmax;background:radial-gradient(circle at 50% 50%,rgba(139,92,246,.42),transparent 65%);animation:drift3 38s ease-in-out infinite alternate}
[data-theme="dark"] .aurora i{opacity:.32}
@keyframes drift1{to{transform:translate(9vmax,7vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-8vmax,9vmax) scale(.94)}}
@keyframes drift3{to{transform:translate(6vmax,-8vmax) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.aurora i{animation:none}}

*{transition-property:background-color,border-color,color;transition-duration:.22s;transition-timing-function:var(--ease)}
body.noanim *{transition:none!important;animation:none!important}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1.5px solid transparent;border-radius:var(--rs);padding:13px 15px;width:100%;outline:none;transition:border-color .18s,box-shadow .18s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
input[type=date]{color-scheme:light dark}
label{display:block;font-size:11.5px;font-weight:800;color:var(--mut);margin:16px 2px 7px;letter-spacing:.09em;text-transform:uppercase}
h1{font-size:25px;letter-spacing:-.03em;font-weight:800} h2{font-size:18px;letter-spacing:-.02em;font-weight:800} h3{font-size:15.5px;font-weight:800;letter-spacing:-.01em}
a{color:var(--acc)}
.hidden{display:none!important}
.mut{color:var(--mut)} .small{font-size:12.5px} .tiny{font-size:11px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.row{display:flex;align-items:center;gap:10px} .grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:5px 11px;border-radius:99px;background:var(--field);color:var(--mut);letter-spacing:.02em;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.danger{background:var(--dangerbg);color:var(--danger)} .chip.acc{background:var(--acc-soft);color:var(--acc)}
.chip.glass{background:rgba(255,255,255,.2);color:#fff}

/* ---------- icons ---------- */
.ic{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:18px;height:18px} .ic.xs{width:15px;height:15px;stroke-width:2.1} .ic.lg{width:26px;height:26px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:800;font-size:15px;border-radius:16px;padding:15px 22px;letter-spacing:-.01em;user-select:none;position:relative;transition:transform .12s var(--spring),box-shadow .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--grad);background-size:150% 150%;color:#fff;box-shadow:var(--sh-glow)}
.btn.pri:hover{box-shadow:0 14px 38px rgba(79,92,229,.45),0 4px 12px rgba(14,165,160,.3)}
.btn.ghost{background:var(--field);color:var(--ink)}
.btn.line{border:1.5px solid var(--bd);color:var(--ink);background:transparent}
.btn.danger{background:var(--dangerbg);color:var(--danger)}
.btn.wide{width:100%} .btn.sm{padding:10px 16px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.45;pointer-events:none}

/* ================= ONBOARD ================= */
#scr-onboard{position:relative;min-height:100dvh;display:flex;flex-direction:column;padding:max(24px,env(safe-area-inset-top)) 26px 34px;max-width:560px;margin:0 auto}
.ob-top{display:flex;justify-content:flex-end;padding-top:4px}
.ob-hero{text-align:center;margin:5vh 0 34px}
.ob-logo{width:92px;height:92px;border-radius:26px;box-shadow:var(--sh-glow);margin-bottom:22px;animation:floaty 5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.ob-brand{font-size:42px;font-weight:900;letter-spacing:-.045em;line-height:1;
 background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ob-tag{color:var(--mut);font-size:16.5px;font-weight:600;margin-top:9px;letter-spacing:-.01em}
.ob-tag b{color:var(--ink)}
.feats{display:flex;flex-direction:column;gap:11px}
.feat{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--bd2);border-radius:20px;padding:15px 16px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--sh-sm)}
.feat .fic{width:46px;height:46px;flex:none;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--sh-sm)}
.feat .fic.g1{background:linear-gradient(135deg,#0ea5a0,#22b8b0)}
.feat .fic.g2{background:linear-gradient(135deg,#4f5ce5,#7c88ff)}
.feat .fic.g3{background:linear-gradient(135deg,#8b5cf6,#a78bfa)}
.feat .fic.g4{background:linear-gradient(135deg,#e06510,#f59e0b)}
.feat b{display:block;font-size:14.5px;letter-spacing:-.01em}
.feat p{color:var(--mut);font-size:12.5px;line-height:1.4;margin-top:1px}
.ob-cta{margin-top:auto;padding-top:28px;display:flex;flex-direction:column;gap:10px}
.ob-terms{font-size:11px;color:var(--mut);text-align:center;margin-top:12px;line-height:1.55}
.ob-demo{font-size:13.5px;font-weight:700;color:var(--acc);text-align:center;padding:10px;letter-spacing:-.01em}

/* ================= APP FRAME ================= */
#app{max-width:600px;margin:0 auto;min-height:100dvh;padding:0 18px 130px}
.top{display:flex;align-items:center;gap:12px;padding:max(16px,env(safe-area-inset-top)) 2px 12px;position:sticky;top:0;z-index:30}
.top:before{content:"";position:absolute;inset:0 -18px;background:linear-gradient(var(--bg) 55%,transparent);z-index:-1}
.brandmark{width:38px;height:38px;border-radius:12px;box-shadow:var(--sh-sm)}
.top h1{font-size:17.5px}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--mut);margin-top:1px}
.syncdot{width:7px;height:7px;border-radius:50%;background:#e0830a;flex:none;position:relative}
.syncdot.on{background:var(--ok)} .syncdot.off{background:var(--mut)}
.syncdot.on:after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--ok);opacity:0;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.8}70%,100%{transform:scale(1.5);opacity:0}}
.iconbtn{width:40px;height:40px;border-radius:13px;background:var(--card);border:1px solid var(--bd2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:var(--sh-sm);transition:transform .12s var(--spring)}
.iconbtn:active{transform:scale(.9)}

main{position:relative}
.screen{display:none} .screen.on{display:block;animation:screenin .3s var(--ease)}
@keyframes screenin{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 11px}
.sect h2{font-size:16px}
.sect .lnk{font-size:13px;font-weight:800;color:var(--acc)}

/* ================= HERO CARD ================= */
.hero{position:relative;border-radius:28px;padding:22px 22px 20px;color:#fff;background:var(--grad);background-size:160% 160%;background-position:0% 50%;box-shadow:0 18px 44px rgba(79,92,229,.4),0 6px 16px rgba(14,165,160,.22);overflow:hidden;margin-top:8px;transition:background-position .6s var(--ease)}
.hero:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.14);filter:blur(4px);top:-140px;right:-70px}
.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.1);filter:blur(3px);bottom:-110px;left:-50px}
.hero .hlabel{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.hero .hamt{font-size:38px;font-weight:900;letter-spacing:-.04em;margin:7px 0 3px;font-variant-numeric:tabular-nums;text-shadow:0 2px 14px rgba(0,0,0,.14)}
.hero .hsub{font-size:12.5px;color:rgba(255,255,255,.78);font-weight:600}
.hero .hgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px;position:relative;z-index:1}
.hero .hcell{background:rgba(255,255,255,.13);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:11px 13px}
.hero .hcell .k{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.66)}
.hero .hcell .v{font-size:15.5px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .hcell .v.hot{color:#ffe0b3}
.hnext{display:flex;align-items:center;gap:11px;margin-top:12px;background:rgba(0,0,0,.16);border-radius:16px;padding:11px 14px;position:relative;z-index:1}
.hnext .ic{color:#a5f3fc}
.hnext .t{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.66)}
.hnext .v{font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums}

/* ================= LOAN CARDS ================= */
.loans{display:flex;flex-direction:column;gap:11px}
.loan{position:relative;display:flex;gap:13px;align-items:center;background:var(--card);border:1px solid var(--bd2);border-radius:22px;padding:15px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--sh-sm);cursor:pointer;transition:transform .14s var(--spring),box-shadow .2s;animation:cardin .38s var(--ease) backwards}
@keyframes cardin{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.loan:active{transform:scale(.975)}
.loan .lic{width:48px;height:48px;flex:none;border-radius:15px;object-fit:contain;background:#fff;padding:6px;box-shadow:var(--sh-sm);position:relative}
.loan .lic.ph{display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:15px;letter-spacing:-.02em}
.loan .t{font-weight:800;font-size:15px;letter-spacing:-.015em;display:flex;align-items:center;gap:6px}
.loan .s{font-size:12px;color:var(--mut);margin-top:2px;font-weight:600}
.loan .right{text-align:right;flex:none}
.loan .amt{font-weight:800;font-size:15.5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pbar{height:5px;background:var(--field);border-radius:99px;margin-top:8px;overflow:hidden;position:relative}
.pbar>i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .7s var(--ease);position:relative;overflow:hidden}
.pbar>i:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-100%);animation:shimmer 2.8s ease infinite}
@keyframes shimmer{60%,100%{transform:translateX(100%)}}
.statechip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.05em;padding:3.5px 9px;border-radius:99px;text-transform:uppercase}
.statechip.due{background:var(--acc-soft);color:var(--acc)}
.statechip.over{background:var(--dangerbg);color:var(--danger)}
.statechip.done{background:var(--okbg);color:var(--ok)}
.statechip.soon{background:var(--warnbg);color:var(--warn)}

/* ================= STATS ================= */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.stat{background:var(--card);border:1px solid var(--bd2);border-radius:20px;padding:15px 16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--sh-sm)}
.stat .ic{color:var(--acc);margin-bottom:8px}
.stat.teal .ic{color:var(--t1)} .stat.violet .ic{color:var(--t3)} .stat.amber .ic{color:#e0830a}
.stat .k{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.stat .v{font-size:21px;font-weight:900;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.card{position:relative;background:var(--card);border:1px solid var(--bd2);border-radius:22px;padding:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--sh-sm);margin-bottom:13px}
.card>h3{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card>h3 .ic{color:var(--acc)}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:14px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;height:100%}
.bars .b i{width:100%;max-width:36px;border-radius:9px;background:var(--grad);opacity:.92;min-height:5px;transition:height .7s var(--ease);position:relative}
.bars .b.past i{opacity:.32}
.bars .b:first-child i{box-shadow:0 6px 18px rgba(79,92,229,.35)}
.bars .b .val{font-size:10px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
.bars .b .l{font-size:10.5px;color:var(--mut);font-weight:800;letter-spacing:.04em}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.lrow:last-child{border:0;padding-bottom:2px}
.lrow .lic2{width:34px;height:34px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--bd);padding:3px;flex:none;box-shadow:var(--sh-sm)}
.lrow .lic2.ph{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;color:#fff}
.lrow .rt{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.lrow .nm{font-size:13px;font-weight:700;letter-spacing:-.01em}
.lrow .ct{font-size:11px;color:var(--mut);font-weight:600}
.lbar{height:4.5px;background:var(--field);border-radius:99px;overflow:hidden;margin-top:6px}
.lbar>i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .7s var(--ease)}
.emptyst{text-align:center;color:var(--mut);padding:26px 10px 12px;font-size:13px;font-weight:600}

/* ================= CALENDAR ================= */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calhead b{font-size:16px;font-weight:800;letter-spacing:-.02em}
.calnav{width:36px;height:36px;border-radius:12px;background:var(--field);display:flex;align-items:center;justify-content:center;color:var(--ink);transition:transform .12s var(--spring)}
.calnav:active{transform:scale(.88)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.calgrid .dow{font-size:10px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;padding:7px 0}
.calgrid .day{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;position:relative;transition:background .15s,transform .12s var(--spring)}
.calgrid .day:active{transform:scale(.9)}
.calgrid .day.today{box-shadow:inset 0 0 0 1.8px var(--acc);color:var(--acc)}
.calgrid .day.sel{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(79,92,229,.4)}
.calgrid .day .dots{display:flex;gap:2.5px;margin-top:2.5px;height:5px}
.calgrid .day .dots i{width:5px;height:5px;border-radius:50%}
.d-red{background:#ef4444} .d-amb{background:#f59e0b} .d-teal{background:var(--t1)}
.caldays{margin-top:6px}

/* ================= NAV DOCK ================= */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;padding:0 18px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
.dock{pointer-events:auto;position:relative;display:flex;align-items:center;gap:2px;background:var(--nav);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--bd2);border-radius:26px;box-shadow:var(--sh-md);padding:7px}
.dockpill{position:absolute;top:7px;bottom:7px;border-radius:19px;background:var(--acc-soft);transition:left .3s var(--spring),width .3s var(--spring);z-index:0}
.navbtn{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:800;color:var(--mut);padding:9px 16px;border-radius:19px;min-width:62px;letter-spacing:.02em;transition:color .2s}
.navbtn .ic{transition:transform .25s var(--spring)}
.navbtn.on{color:var(--acc)}
.navbtn.on .ic{transform:translateY(-1.5px) scale(1.08)}
.navadd{position:relative;z-index:1;width:54px;height:54px;border-radius:19px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 5px;box-shadow:var(--sh-glow);flex:none;transition:transform .22s var(--spring)}
.navadd:active{transform:scale(.88) rotate(90deg)}

/* ================= SHEETS ================= */
.ov{position:fixed;inset:0;background:rgba(7,10,20,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:60;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex;animation:ovin .22s ease}
@keyframes ovin{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card-solid);width:100%;max-width:600px;max-height:92dvh;overflow-y:auto;border-radius:30px 30px 0 0;padding:10px 22px calc(26px + env(safe-area-inset-bottom));animation:sheetup .34s var(--spring);box-shadow:0 -20px 60px rgba(7,10,20,.3);overscroll-behavior:contain}
[data-theme="dark"] .sheet{background:#12161f}
@keyframes sheetup{from{transform:translateY(80px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:99px;background:var(--bd);margin:8px auto 16px}
.sheet h2{margin-bottom:2px}
.sheet .sub{color:var(--mut);font-size:13px;font-weight:600;margin-bottom:6px}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.lpick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px 9px;border-radius:16px;border:2px solid transparent;background:var(--field);cursor:pointer;transition:transform .12s var(--spring),border-color .15s,background .15s}
.lpick:active{transform:scale(.93)}
.lpick img{width:34px;height:34px;object-fit:contain}
.lpick span{font-size:10px;font-weight:800;color:var(--mut);text-align:center;line-height:1.15;letter-spacing:-.01em}
.lpick.on{border-color:var(--acc);background:var(--acc-soft)}
.lpick.on span{color:var(--acc)}
.cgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.cpick{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:9px 14px;border-radius:99px;background:var(--field);color:var(--mut);border:2px solid transparent;transition:transform .12s var(--spring),border-color .15s}
.cpick:active{transform:scale(.94)}
.cpick.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;z-index:2;cursor:pointer}
.switch i{position:absolute;inset:0;background:var(--field);border-radius:99px;transition:.25s var(--ease)}
.switch i:before{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.25s var(--spring);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.switch input:checked+i{background:var(--acc)}
.switch input:checked+i:before{transform:translateX(20px)}

/* ================= LISTS / DETAIL ================= */
.hrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);font-size:14px}
.hrow:last-child{border:0}
.hrow .dd{width:46px;height:46px;flex:none;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.1}
.hrow .dd.ok{background:var(--okbg);color:var(--ok)} .hrow .dd.mut2{background:var(--field);color:var(--ink2)}
.hrow .dd small{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.dsumgrid{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--field);border-radius:18px;padding:14px 0;margin:12px 0}
.dsumgrid>div{padding:0 14px}
.dsumgrid .k{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.dsumgrid .v{font-size:16.5px;font-weight:900;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ================= PROFILE ================= */
.pcard{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--bd2);border-radius:24px;padding:19px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--sh-sm);margin-top:8px}
.pavatar{width:64px;height:64px;border-radius:22px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;flex:none;box-shadow:var(--sh-glow)}
.pgroup{background:var(--card);border:1px solid var(--bd2);border-radius:22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--sh-sm);overflow:hidden}
.prow{display:flex;align-items:center;gap:13px;padding:15px 17px;border-bottom:1px solid var(--bd)}
.prow:last-child{border:0}
.prow .pic{width:36px;height:36px;flex:none;border-radius:12px;background:var(--field);display:flex;align-items:center;justify-content:center;color:var(--acc)}
.prow .pic.teal{color:var(--t1)} .prow .pic.violet{color:var(--t3)} .prow .pic.amber{color:#e0830a} .prow .pic.red{color:var(--danger)}
.prow .t{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.prow .s{font-size:12px;color:var(--mut);font-weight:600;margin-top:1px}
.seg{display:flex;background:var(--field);border-radius:13px;padding:3px;gap:2px}
.seg button{font-size:12px;font-weight:800;padding:8px 13px;border-radius:10px;color:var(--mut);transition:all .18s}
.seg button.on{background:var(--card-solid);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.14)}

/* ================= BANNERS / TOASTS / SKEL ================= */
.banner{display:flex;gap:12px;align-items:center;background:var(--warnbg);border:1.5px solid rgba(224,131,10,.3);color:var(--warn);border-radius:20px;padding:14px 16px;margin-bottom:13px;font-size:13.5px;font-weight:700;animation:cardin .4s var(--ease)}
.banner .ic{flex:none}
.banner .btn{margin-left:auto;flex:none;background:var(--warn);color:#fff}
#toasts{position:fixed;top:calc(14px + env(safe-area-inset-top));left:0;right:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;background:rgba(16,20,37,.92);color:#fff;font-size:13.5px;font-weight:700;padding:12px 20px;border-radius:99px;box-shadow:var(--sh-md);animation:toastin .35s var(--spring);max-width:86%;backdrop-filter:blur(10px)}
[data-theme="dark"] .toast{background:rgba(240,242,250,.94);color:#101425}
@keyframes toastin{from{transform:translateY(-16px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.toast.err{background:rgba(224,52,44,.95);color:#fff}
.skel{border-radius:22px;background:var(--field);position:relative;overflow:hidden}
.skel:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(120,130,160,.14) 50%,transparent 70%);transform:translateX(-100%);animation:shimmer 1.6s ease infinite}

@media (max-width:420px){ .hero .hamt{font-size:33px} .navbtn{min-width:56px;padding:9px 13px} .lgrid{gap:7px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMI Flow — Small Payments. A Bigger Tomorrow.</title>
<meta name="description" content="EMI Flow — track every EMI across every lender. Cloud-synced, offline-first, private.">
<meta name="theme-color" content="#10121f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
/* ================================================================
   EMI Flow v3.0 — pixel build of the design system
   light lavender · white cards · indigo→navy gradient pills
   ================================================================ */
:root{
  --bg:#f1f2f5; --card:#ffffff; --field:#f1f2f5; --bd:rgba(18,20,30,.055);
  --ink:#14151b; --ink2:#3c3f4d; --mut:#8b8e9c;
  --acc:#2f6bf7; --acc2:#38bdf8; --acc-soft:#e9f0fe;
  --ok:#17996a; --okbg:#e5f6ef; --warn:#b57a10; --warnbg:#fbf2df;
  --danger:#dd4b4b; --dangerbg:#fdecec;
  --pill:linear-gradient(118deg,#5b9dff 0%,#2f6bf7 55%,#2450d0 120%);
  --sh:0 1px 2px rgba(16,18,28,.04),0 16px 40px -22px rgba(16,18,28,.20);
  --r:22px; --rs:15px; --ease:cubic-bezier(.25,.8,.3,1);
}
[data-theme="dark"]{
  --bg:#0e0f14; --card:#17181f; --field:#1f2029; --bd:rgba(255,255,255,.06);
  --ink:#f1f2f7; --ink2:#c8cad4; --mut:#82859a;
  --acc:#6f9bff; --acc2:#56c8f5; --acc-soft:#1b2440;
  --ok:#3ec78f; --okbg:#122720; --warn:#e8ab48; --warnbg:#2a2115;
  --danger:#f07171; --dangerbg:#2c1a1e;
  --pill:linear-gradient(118deg,#5b9dff 0%,#2f6bf7 60%,#1a2560 130%);
  --sh:0 1px 2px rgba(0,0,0,.25),0 16px 40px -20px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{min-height:100dvh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5}
body.noanim *{transition:none!important;animation:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1.5px solid transparent;border-radius:16px;padding:13px 15px;width:100%;outline:none;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{background:var(--card);border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
select{appearance:none;-webkit-appearance:none;padding-right:42px;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238a8fa6' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center}
select option{color:#181b2a;background:#fff}
input::placeholder,textarea::placeholder{color:var(--mut)}
label.fl{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:16px 2px 7px}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
.hidden{display:none!important}
.mut{color:var(--mut)} .small{font-size:13px} .tiny{font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;background:var(--field);border:1px solid var(--bd);font-size:11.5px;font-weight:650;color:var(--mut);white-space:nowrap}
.chip.ok{background:var(--okbg);border-color:transparent;color:var(--ok)}
.chip.acc{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.pill:active{transform:scale(.975)}
.navplus:active{transform:scale(.92)}
button:active{opacity:.92}
.mrow:active,.tl:active,.cattile:active{opacity:.75}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.syncdot{transition:background .25s;animation:syncpulse 1.5s ease-in-out infinite}
.syncdot.on{background:var(--ok);animation:none}
.syncdot.off{background:var(--danger);animation:none}
.syncdot.space{background:transparent;animation:none}
@keyframes syncpulse{0%,100%{opacity:1}50%{opacity:.35}}
.row{display:flex;align-items:center;gap:10px} .grow{flex:1;min-width:0}

/* ---------- icons ---------- */
.ic{width:21px;height:21px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:18px;height:18px} .ic.xs{width:15px;height:15px} .ic.lg{width:24px;height:24px}

/* ---------- gradient pill buttons ---------- */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:16px 22px;border-radius:99px;background:var(--pill);background-size:130% 130%;color:#fff;font-weight:700;font-size:15.5px;letter-spacing:-.01em;box-shadow:0 12px 28px -10px rgba(47,107,247,.5);transition:transform .12s,box-shadow .2s}
.pill:active{transform:scale(.97)}
.pill:disabled{opacity:.5;pointer-events:none}
.pill .ic{stroke-width:2}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:650;border-radius:99px;padding:11px 18px;font-size:14px;background:var(--field);color:var(--ink);transition:transform .1s}
.btn2:active{transform:scale(.96)}
.btn2.danger{background:var(--dangerbg);color:var(--danger)}
.btn2.wfull{width:100%}
.logout{width:100%;padding:16px;border-radius:18px;background:#e35d5d;color:#fff;font-weight:700;font-size:15.5px;box-shadow:0 10px 24px rgba(227,93,93,.3)}
.logout:active{transform:scale(.97)}

/* ================= SPLASH ================= */
#scr-splash{position:fixed;inset:0;z-index:200;background:#0c0e1a;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;overflow:hidden}
#scr-splash .aur{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
#scr-splash .aur.a{width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:radial-gradient(circle,rgba(124,92,246,.55),transparent 62%)}
#scr-splash .aur.b{width:60vmax;height:60vmax;right:-24vmax;bottom:-26vmax;background:radial-gradient(circle,rgba(86,95,233,.5),transparent 62%)}
#scr-splash .wave{position:absolute;left:0;right:0;height:44%;bottom:0;opacity:.9}
.spl-icon{width:92px;height:92px;border-radius:26px;background:linear-gradient(140deg,#8b7cff,#565fe9 60%,#3a3f8f);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 50px rgba(124,92,246,.5);position:relative;z-index:1;animation:splpop .8s var(--ease)}
@keyframes splpop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.spl-name{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:26px;position:relative;z-index:1}
.spl-tag{color:rgba(255,255,255,.65);font-size:15px;margin-top:4px;text-align:center;position:relative;z-index:1;line-height:1.45}
.spl-foot{position:absolute;bottom:max(34px,env(safe-area-inset-bottom));text-align:center;color:rgba(255,255,255,.55);font-size:13.5px;line-height:1.6;z-index:1}

/* ================= ONBOARDING ================= */
.ob-page{min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#fbfbff 0%,var(--bg) 100%);padding:max(18px,env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
.ob-skip{align-self:flex-end;font-size:14.5px;font-weight:650;color:var(--mut);padding:10px 6px}
.ob-stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.ob-slide{display:none;flex-direction:column;align-items:center;text-align:center}
.ob-slide.on{display:flex;animation:obin .35s var(--ease)}
@keyframes obin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.ob-art{height:250px;display:flex;align-items:center;justify-content:center;margin-bottom:26px;position:relative;width:100%}
.ob-title{font-size:25px;font-weight:800;letter-spacing:-.025em;line-height:1.22}
.ob-title b{color:var(--acc)}
.ob-sub{color:var(--mut);font-size:14.5px;margin-top:10px;max-width:300px;line-height:1.55}
.ob-dots{display:flex;gap:7px;justify-content:center;margin:26px 0}
.ob-dots i{width:8px;height:8px;border-radius:99px;background:#d9dbef;transition:all .25s}
.ob-dots i.on{width:22px;background:var(--acc)}
/* slide art: floating tiles */
.tiles3d{position:relative;width:230px;height:210px}
.tiles3d .t{position:absolute;width:74px;height:74px;border-radius:20px;background:#fff;box-shadow:0 16px 34px rgba(60,64,120,.16),0 3px 8px rgba(60,64,120,.08);display:flex;align-items:center;justify-content:center;animation:bob 4.2s ease-in-out infinite}
.tiles3d .t img{width:46px;height:46px;object-fit:contain}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--rot))}50%{transform:translateY(-10px) rotate(var(--rot))}}
/* slide art: calendar card + bell */
.calbell{position:relative;width:250px;height:220px}
.calbell .cal{position:absolute;left:10px;top:14px;width:180px;border-radius:22px;background:#fff;box-shadow:0 18px 40px rgba(60,64,120,.16);padding:16px;transform:rotate(-6deg)}
.calbell .cal .ch{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;font-weight:700;margin-bottom:10px}
.calbell .cal .cg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.calbell .cal .cg i{height:16px;border-radius:6px;background:var(--field)}
.calbell .cal .cg i.h{background:var(--acc-soft)}
.calbell .due{position:absolute;right:0;bottom:44px;background:#fff;border-radius:16px;box-shadow:0 14px 30px rgba(60,64,120,.16);padding:11px 15px;display:flex;gap:10px;align-items:center;transform:rotate(3deg);z-index:2}
.calbell .due .ic{color:var(--acc)}
.calbell .due b{font-size:14px;display:block}
.calbell .due span{font-size:11px;color:var(--mut);font-weight:600}
.calbell .bellic{position:absolute;right:22px;top:6px;width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 14px 30px rgba(60,64,120,.16);display:flex;align-items:center;justify-content:center;color:#8b5cf6;z-index:2;animation:bob2 3s ease-in-out infinite}
@keyframes bob2{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
/* slide art: bar chart 3d-ish */
.bars3d{display:flex;align-items:flex-end;gap:14px;height:190px}
.bars3d .b{width:44px;border-radius:12px;background:linear-gradient(180deg,#a78bfa,#565fe9);box-shadow:0 14px 30px rgba(86,95,233,.3);position:relative;animation:grow 1s var(--ease) backwards}
.bars3d .b:nth-child(2){height:52%;animation-delay:.1s;background:linear-gradient(180deg,#c4b5fd,#8b5cf6)}
.bars3d .b:nth-child(1){height:34%;background:linear-gradient(180deg,#c4b5fd,#8b5cf6)}
.bars3d .b:nth-child(3){height:86%;animation-delay:.2s}
.bars3d .b:nth-child(4){height:64%;animation-delay:.3s;background:linear-gradient(180deg,#c4b5fd,#8b5cf6)}
@keyframes grow{from{height:0}}

/* ================= AUTH PAGES ================= */
.au-page{min-height:100dvh;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 26px calc(28px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;width:100%}
.au-back{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--ink);margin:6px 0 10px}
.au-hero{margin:18px 0 8px}
.au-hero h1{font-size:27px}
.au-hero h1 .wave{display:inline-block}
.au-hero p{color:var(--mut);font-size:14px;margin-top:6px;line-height:1.5}
.frow{display:flex;align-items:center;gap:0;background:var(--field);border:1.5px solid var(--bd);border-radius:14px;overflow:hidden}
.frow:focus-within{border-color:var(--acc)}
.frow .fx{padding:13px 14px;font-weight:700;color:var(--ink2);border-right:1.5px solid var(--bd);font-size:14.5px;white-space:nowrap}
.frow input{border:0;background:transparent;border-radius:0;flex:1}
.frow input:focus{box-shadow:none}
.ieye{padding:0 14px;color:var(--mut);display:flex}
.aerr{font-size:13px;color:var(--danger);font-weight:600;margin-top:10px}
.au-or{display:flex;align-items:center;gap:14px;color:var(--mut);font-size:12.5px;font-weight:600;margin:22px 0 14px}
.au-or:before,.au-or:after{content:"";flex:1;height:1px;background:var(--bd)}
.au-soc{display:flex;justify-content:center;gap:16px;margin-bottom:8px}
.au-soc button{width:56px;height:56px;border-radius:50%;background:var(--card);border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--ink);transition:transform .1s}
.au-soc button:active{transform:scale(.92)}
.au-foot{text-align:center;font-size:14px;color:var(--mut);margin-top:20px}
.au-foot b{color:var(--acc);font-weight:700;cursor:pointer}
.chk{display:flex;align-items:flex-start;gap:10px;margin-top:16px;font-size:13px;color:var(--ink2);line-height:1.5}
.chk input{width:19px;height:19px;flex:none;accent-color:var(--acc);margin-top:1px}
.au-links{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.au-links .lk{font-size:13.5px;font-weight:650;color:var(--acc)}
/* success */
.suc-top{align-self:flex-end;text-align:right;color:var(--ink2);font-size:13px;font-weight:700;line-height:1.35;margin-top:8px}
.suc-art{position:relative;height:280px;display:flex;align-items:center;justify-content:center}
.cone{width:120px;height:120px;border-radius:36px;background:linear-gradient(140deg,#a78bfa,#565fe9);transform:rotate(-14deg);box-shadow:0 24px 50px rgba(86,95,233,.35);display:flex;align-items:center;justify-content:center}
.cone .ic{width:54px;height:54px;color:#fff;stroke-width:1.6}
.conf{position:absolute;width:10px;height:14px;border-radius:3px;animation:conf 2.6s ease-in-out infinite}
@keyframes conf{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(40deg)}}
.suc-title{text-align:center;font-size:28px;font-weight:800;letter-spacing:-.025em;margin-top:10px}
.suc-sub{text-align:center;color:var(--mut);font-size:14.5px;margin:10px 0 30px;line-height:1.6}

/* ================= APP ================= */
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:0 20px 130px}
.topbar{display:flex;align-items:flex-start;gap:12px;padding:max(20px,env(safe-area-inset-top)) 0 14px}
.topbar .tb-title{font-size:14px;color:var(--mut);font-weight:600}
.topbar h1{font-size:23px;margin-top:1px}
.tb-ic{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--ink2);position:relative;flex:none;transition:transform .1s}
.tb-ic:active{transform:scale(.9)}
.tb-ic .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--card)}
.app-scr{display:none}
.app-scr.on{display:block;animation:scrin .22s var(--ease)}
@keyframes scrin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pgtitle{display:flex;align-items:center;gap:12px;padding:max(20px,env(safe-area-inset-top)) 0 16px}
.pgtitle h1{font-size:22px}
.card{background:var(--card);border:0;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:var(--sh)}

/* ---------- home hero ---------- */
.hero{background:var(--card);border:0;border-radius:26px;padding:22px;margin-top:2px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero.grad{background:linear-gradient(155deg,#8ed4e6 0%,#4a90f7 52%,#2f5ce8 100%);box-shadow:0 20px 44px -18px rgba(47,92,232,.55)}
.hero .hl{font-size:13.5px;color:var(--mut);font-weight:600}
.hero.grad .hl{color:rgba(255,255,255,.88)}
.hero .hv{font-size:44px;font-weight:800;letter-spacing:-.035em;margin:6px 0 0;font-variant-numeric:tabular-nums;color:var(--ink)}
.hero.grad .hv{color:#fff}
.hero .hv small{font-size:16px;color:var(--mut);font-weight:650;letter-spacing:0}
.hero.grad .hv small{color:rgba(255,255,255,.85)}
.hero .spark{display:block;width:100%;height:74px;margin-top:10px}
.hero .vlink{display:inline-flex;align-items:center;gap:6px;color:var(--acc);font-weight:700;font-size:13.5px;margin-top:12px;padding:9px 18px;border-radius:99px;transition:transform .12s}
.hero .vlink:active{transform:scale(.96)}
.hero.grad .vlink{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);color:#fff;backdrop-filter:blur(4px)}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}
.htile{background:var(--card);border:0;border-radius:22px;padding:17px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.htile .hic{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.htile .hic.p{background:#ece9fe;color:#7c5cf0} .htile .hic.g{background:#e2f6ec;color:#1fa971}
.htile .hic.b{background:#e4edfd;color:#2f6fd6} .htile .hic.o{background:#fdeeda;color:#d98a1f}
.htile .k{font-size:12.5px;color:var(--mut);font-weight:600}
.htile .v{font-size:21px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.025em}
.htile .s{font-size:11.5px;color:var(--mut);margin-top:1px;font-weight:550}
.motivate{display:flex;align-items:center;gap:11px;background:var(--acc-soft);border-radius:18px;padding:13px 16px;margin-top:13px;font-size:13px;color:var(--ink2);font-weight:600;line-height:1.45}
.motivate.warn{background:var(--warnbg);color:var(--warn)}
.motivate .ic{flex:none;color:var(--acc)}
.motivate.warn .ic{color:var(--warn)}

/* ---------- seg tabs ---------- */
.seg2{display:flex;background:var(--field);border-radius:99px;padding:4px;gap:2px;margin:6px 0 14px}
.seg2 button{flex:1;font-size:13px;font-weight:650;color:var(--mut);padding:9px 6px;border-radius:99px;white-space:nowrap}
.seg2 button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(24,27,42,.1)}

/* ---------- EMI rows ---------- */
.emilist{display:flex;flex-direction:column;gap:10px}
.emirow{display:flex;align-items:center;gap:13px;background:var(--card);border:0;border-radius:20px;padding:15px;cursor:pointer;transition:transform .1s;box-shadow:var(--sh)}
.emirow:active{transform:scale(.985)}
.emirow .logo{width:46px;height:46px;border-radius:14px;background:#fff;border:1px solid var(--bd);object-fit:contain;padding:5px;flex:none}
.emirow .logo.ph{display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px}
.emirow .t{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.emirow .s{font-size:12px;color:var(--mut);margin-top:1px}
.emirow .amt{font-weight:750;font-size:15px;font-variant-numeric:tabular-nums}
.emirow .st{font-size:11.5px;margin-top:2px;font-weight:600;text-align:right}
.emirow .st.ok{color:var(--ok)} .emirow .st.warn{color:var(--warn)} .emirow .st.bad{color:var(--danger)} .emirow .st.mut{color:var(--mut)}
.fabpill{position:sticky;bottom:96px;display:flex;margin-top:16px;z-index:5}

/* ---------- insights ---------- */
.bigstat .k{font-size:13.5px;color:var(--mut);font-weight:600}
.bigstat .vrow{display:flex;align-items:center;gap:10px;margin-top:4px}
.bigstat .v{font-size:32px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.delta.up{background:var(--okbg);color:var(--ok)} .delta.down{background:var(--dangerbg);color:var(--danger)}
.chartbars{display:flex;align-items:flex-end;gap:10px;height:130px;margin-top:18px}
.chartbars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chartbars .b i{width:100%;max-width:30px;border-radius:9px;background:linear-gradient(180deg,#a78bfa,#565fe9);min-height:5px;transition:height .6s var(--ease)}
.chartbars .b.past i{opacity:.3}
.chartbars .b .l{font-size:10.5px;color:var(--mut);font-weight:600}
.chartbars .b .val{font-size:10px;color:var(--mut);font-weight:650}
.donutrow{display:flex;align-items:center;gap:20px;margin-top:6px}
.donut{position:relative;width:132px;height:132px;flex:none}
.donut svg{transform:rotate(-90deg)}
.donut .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .dc b{font-size:17px;font-weight:800}
.donut .dc span{font-size:10.5px;color:var(--mut);font-weight:600}
.dleg{flex:1;display:flex;flex-direction:column;gap:11px}
.dleg .li{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
.dleg .li i{width:10px;height:10px;border-radius:4px;flex:none}
.dleg .li .pc{margin-left:auto;color:var(--mut);font-weight:650;font-variant-numeric:tabular-nums}
.trendwrap{position:relative;margin-top:8px}
.trendwrap svg{width:100%;height:110px;display:block}
.oknote{display:flex;align-items:center;gap:11px;background:var(--okbg);color:var(--ok);border-radius:18px;padding:14px 16px;font-size:13.5px;font-weight:650;margin-top:14px}
.oknote .ic{flex:none}

/* ---------- calendar ---------- */
.cal{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px 12px}
.calhead{display:flex;align-items:center;justify-content:space-between;padding:0 6px;margin-bottom:10px}
.calhead b{font-size:16px;font-weight:750}
.calnav{width:36px;height:36px;border-radius:50%;background:var(--field);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
.calgrid .dow{font-size:11px;color:var(--mut);font-weight:600;padding:8px 0}
.cday{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative}
.cday span{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600}
.cday.today span{box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--acc)}
.cday.due span{background:var(--acc);color:#fff;box-shadow:0 5px 12px rgba(86,95,233,.4)}
.cday.odata span{background:var(--danger);color:#fff;box-shadow:0 5px 12px rgba(224,82,82,.4)}
.cday i.nd{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--acc)}
.duelist{margin-top:12px}
.duerow{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 15px;margin-bottom:8px;cursor:pointer}
.duerow:active{transform:scale(.985)}
.duerow .d{font-size:12.5px;color:var(--mut);font-weight:650}
.duerow .n{font-weight:700;font-size:14px}
.duerow .a{font-weight:750;font-variant-numeric:tabular-nums}

/* ---------- add page ---------- */
.cattiles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:4px}
.cattile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px;border-radius:16px;border:1.5px solid var(--bd);background:var(--card);cursor:pointer;transition:border-color .12s}
.cattile .cic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff}
.cattile span{font-size:11.5px;font-weight:650;color:var(--ink2)}
.cattile.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.selectrow{position:relative}
.selectrow select{appearance:none;-webkit-appearance:none;padding-right:40px}
.selectrow:after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.swrow{display:flex;align-items:center;justify-content:space-between;background:var(--field);border:1.5px solid var(--bd);border-radius:14px;padding:13px 15px;margin-top:16px}
.swrow .t{font-weight:650;font-size:14.5px}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;width:100%;height:100%;position:absolute;z-index:2;cursor:pointer}
.sw i{position:absolute;inset:0;background:#d9dbef;border-radius:99px;transition:.2s}
.sw i:before{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i:before{transform:translateX(20px)}

/* ---------- profile ---------- */
.pcard{display:flex;align-items:center;gap:15px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:18px;margin-top:2px}
.pava{width:62px;height:62px;border-radius:50%;background:var(--pill);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;flex:none}
.pcard h2{font-size:19px}
.pcard .em{font-size:13px;color:var(--mut);margin-top:1px}
.editbtn{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--acc);background:var(--acc-soft);padding:6px 12px;border-radius:99px}
.mlist{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;margin-bottom:14px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;padding:15px 17px;border-bottom:1px solid var(--bd);text-align:left}
.mrow:last-child{border:0}
.mrow .mic{width:36px;height:36px;border-radius:12px;background:var(--field);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.mrow .mt{font-weight:650;font-size:14.5px}
.mrow .chev{margin-left:auto;color:var(--mut)}

/* ---------- bottom nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:480px;margin:0 auto;display:flex;align-items:center;padding:8px 8px}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--mut);font-weight:600;padding:5px 0;transition:color .2s}
.navbtn .nic{width:46px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:99px;transition:background .22s,color .22s,box-shadow .22s}
.navbtn.on{color:var(--ink);font-weight:700}
.navbtn.on .nic{background:#16171d;color:#fff;box-shadow:0 6px 16px -6px rgba(16,18,28,.45)}
[data-theme="dark"] .navbtn.on .nic{background:#f1f2f7;color:#14151b;box-shadow:0 6px 16px -6px rgba(0,0,0,.7)}
.navplus{flex:0 0 auto;width:52px;height:52px;border-radius:18px;background:linear-gradient(140deg,#5b9dff,#2f6bf7);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 6px;box-shadow:0 12px 24px -8px rgba(47,107,247,.6);transition:transform .15s}
.navplus:active{transform:scale(.9)}

/* ---------- sheets / toasts ---------- */
.ov{position:fixed;inset:0;background:rgba(16,18,32,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex;animation:ovin .18s ease}
@keyframes ovin{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:88dvh;overflow-y:auto;border-radius:26px 26px 0 0;padding:8px 22px calc(26px + env(safe-area-inset-bottom));animation:sheetup .28s var(--ease)}
@keyframes sheetup{from{transform:translateY(60px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:99px;background:var(--bd);margin:8px auto 16px}
.dsum{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--field);border-radius:16px;padding:14px 0;margin:14px 0}
.dsum>div{padding:0 14px}
.dsum .k{font-size:11.5px;color:var(--mut);font-weight:600}
.dsum .v{font-size:16px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums}
.hrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);font-size:14px}
.hrow:last-child{border:0}
.hrow .dd{width:42px;height:42px;flex:none;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1.1}
.hrow .dd.ok{background:var(--okbg);color:var(--ok)} .hrow .dd.mut2{background:var(--field);color:var(--ink2)}
.hrow .dd small{font-size:9px;font-weight:700;text-transform:uppercase}
.prog{height:5px;background:var(--field);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,#8b7cff,#565fe9);border-radius:99px;transition:width .5s var(--ease)}
#toasts{position:fixed;top:calc(14px + env(safe-area-inset-top));left:0;right:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#1c1f33;color:#fff;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:99px;max-width:86%;animation:toastin .3s var(--ease)}
[data-theme="dark"] .toast{background:#2a2f4a}
@keyframes toastin{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.toast.err{background:#e05252}

@media (max-width:390px){ .hero .hv{font-size:31px} .navbtn{font-size:10px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
